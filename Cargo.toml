    [package]
    name = "ores-otel-desktop-app"
    version = "0.1.0"
    edition = "2021"
    license = "MIT"
    description = "Native Rust desktop app for ores-otel"
    repository = "https://github.com/ores-otel/ores-otel-desktop-app.rs"
    default-run = "ores-otel-desktop"

    [lib]
    name = "ores_otel_desktop_core"
    path = "src/lib.rs"

    [[bin]]
    name = "ores-otel-desktop"
    path = "src/main.rs"

    [dependencies]
    serde = { version = "1", features = ["derive"] }
    serde_json = "1"
    oresoftware-next-loggers = { git = "https://github.com/ores-otel/ores.otel.log.git", rev = "a5ec8812df692ccc3bdcaaf89d984c44714970d5" }

[lints.rust]
unsafe_code = "forbid"


